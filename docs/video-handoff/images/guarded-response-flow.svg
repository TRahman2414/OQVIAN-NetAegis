<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3278c7"/></marker><marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ad751f"/></marker></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="92" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#258a78">OQVIAN NETAEGIS</text><text x="90" y="168" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#17263c">Bounded response and escalation</text><text x="90" y="215" font-family="Arial,sans-serif" font-size="23" fill="#5f6f82">The backend checks every model request; the model cannot run shell commands or choose unlisted actions.</text><rect x="100" y="340" width="280" height="190" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="100" y="340" width="10" height="190" rx="5" fill="#3278c7"/><text x="130" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">Wazuh alert</text><text x="130" y="428" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Severity + evidence</text><text x="130" y="457" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Host identity</text><rect x="480" y="340" width="300" height="190" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="480" y="340" width="10" height="190" rx="5" fill="#258a78"/><text x="510" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">Backend policy gate</text><text x="510" y="428" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Validate request</text><text x="510" y="457" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Check scope + approval</text><path d="M380 435H460" fill="none" stroke="#3278c7" stroke-width="5" marker-end="url(#arrow)"/><rect x="900" y="285" width="290" height="155" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="900" y="285" width="10" height="155" rx="5" fill="#258a78"/><text x="930" y="333" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">Low-risk checks</text><text x="930" y="373" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Diagnostics / bounded retry</text><text x="930" y="402" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Eligible by policy</text><rect x="900" y="475" width="290" height="155" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="900" y="475" width="10" height="155" rx="5" fill="#ad751f"/><text x="930" y="523" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">Approval required</text><text x="930" y="563" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Approved service restart</text><text x="930" y="592" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Approved config restore</text><rect x="1260" y="375" width="260" height="170" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="1260" y="375" width="10" height="170" rx="5" fill="#7468b5"/><text x="1290" y="423" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">Human escalation</text><text x="1290" y="463" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Critical / uncertain</text><text x="1290" y="492" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Repeated or failed action</text><path d="M780 395H870" fill="none" stroke="#258a78" stroke-width="4" marker-end="url(#arrow)"/><path d="M780 475H870" fill="none" stroke="#ad751f" stroke-width="4" marker-end="url(#arrow2)"/><path d="M780 520H840V715H1375V565" fill="none" stroke="#7468b5" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="900" y="690" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a4347">Blocked: delete/wipe data or run arbitrary commands</text><text x="900" y="730" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Current demo: policy preview only; no action executes.</text><rect x="90" y="810" width="1420" height="46" rx="12" fill="#fff2dc" stroke="#f1d49e"/><text x="120" y="840" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ad751f">CONCEPTUAL WORKFLOW · CURRENT PUBLIC DEMO USES SYNTHETIC DATA</text></svg>