mited</text><text x="630" y="537" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Audit record stays local</text><rect x="1190" y="420" width="320" height="190" rx="18" fill="#fff" stroke="#d8e1eb" stroke-width="2"/><rect x="1190" y="420" width="10" height="190" rx="5" fill="#7468b5"/><text x="1220" y="468" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17263c">OQVIAN owner</text><text x="1220" y="508" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Monthly health audit</text><text x="1220" y="537" font-family="Arial,sans-serif" font-size="18" fill="#5f6f82">Approved troubleshooting</text><path d="M455 515H580" fill="none" stroke="#3278c7" stroke-width="5" marker-end="url(#arrow)"/><path d="M960 515H1170" fill="none" stroke="#3278c7" stroke-width="5" marker-end="url(#arrow)"/><text x="1067" y="486" font-family="Arial,sans-serif" font-size="16" fill="#5f6f82">approved session</text><text x="115" y="755" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ad751f">No always-on access · no routine telemetry upload · customer controls approval and revocation</text><rect x="90" y="810" width="1420" height="46" rx="12" fill="#fff2dc" stroke="#f1d49e"/><text x="120" y="840" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ad751f">CONCEPTUAL WORKFLOW · CURRENT PUBLIC DEMO USES SYNTHETIC DATA</text></svg>